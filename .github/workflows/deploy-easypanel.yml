name: Deploy to Easypanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -m "not integration" --cov=app --cov-report=xml --cov-report=html

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run -- --coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/clover.xml
          flags: frontend
          fail_ci_if_error: false

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Trigger Easypanel deployment
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL || 'http://82.25.97.112:3000/api/compose/deploy/ff029a14f79b4b78520188ae12c7631ee7573b792b0528ab' }}
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 30 --connect-timeout 10 --retry 3 --retry-delay 5 "$DEPLOY_URL")
          echo "Deploy URL: $DEPLOY_URL"
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deployment triggered successfully."
          else
            echo "Deployment request failed with status $http_code"
            exit 1
          fi

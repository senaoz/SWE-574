name: Deploy to Easypanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -m "not integration" --no-cov

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Trigger Easypanel deployment
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL || 'http://82.25.97.112:3000/api/compose/deploy/76e77b79c86de85ddde70ec4b3ac93fcccc71fdb303a261e' }}
        run: |
          response=$(curl -s -w "\n%{http_code}" "$DEPLOY_URL")
          echo "Deploy URL: $DEPLOY_URL"
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deployment triggered successfully."
          else
            echo "Deployment request failed with status $http_code"
            exit 1
          fi
